# Chạy toàn bộ hệ thống bằng MỘT lệnh:
#
#   cp .env.example .env      # lần đầu; điền DATABASE_URL và 9router (xem README.md)
#   docker compose up -d --build
#
# tts khởi động service TTS VieNeu, migrate chạy migration rồi thoát; sau đó worker và app khởi động.
# App: http://127.0.0.1:3000 (chỉ nghe trên máy này vì chưa có đăng nhập).
# Dừng: docker compose down

name: cartoon

x-runtime-env: &runtime-env
  DATABASE_URL: "${DATABASE_URL:?thiếu DATABASE_URL trong .env - xem README.md}"
  DATABASE_CA_CERT: ${DATABASE_CA_CERT:-}
  DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-verify-full}
  DATA_DIR: /app/data
  NINE_ROUTER_BASE_URL: ${NINE_ROUTER_BASE_URL:-}
  NINE_ROUTER_API_KEY: ${NINE_ROUTER_API_KEY:-}
  LLM_WRITER_MODEL: ${LLM_WRITER_MODEL:-}
  LLM_JUDGE_MODEL: ${LLM_JUDGE_MODEL:-}
  LLM_JUDGE_ALLOW_SAME_FAMILY: ${LLM_JUDGE_ALLOW_SAME_FAMILY:-}
  YOUTUBE_OAUTH_CLIENT_ID: ${YOUTUBE_OAUTH_CLIENT_ID:-}
  YOUTUBE_OAUTH_CLIENT_SECRET: ${YOUTUBE_OAUTH_CLIENT_SECRET:-}
  YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
  YOUTUBE_TOKEN_ISSUED_AT: ${YOUTUBE_TOKEN_ISSUED_AT:-}
  IMAGE_MODEL: ${IMAGE_MODEL:-}
  LOCAL_TTS_URL: ${LOCAL_TTS_URL:-http://tts:8080}

# App và worker dùng chung ./data (ảnh, video) và ./certs (CA cert của Supabase, nếu cần).
x-runtime-volumes: &runtime-volumes
  - ./data:/app/data
  - ./certs:/app/certs:ro

services:
  tts:
    build:
      context: ./services/tts
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    build:
      context: .
      target: worker
    command: ["node_modules/.bin/tsx", "src/lib/db/migrate.ts"]
    environment: *runtime-env
    volumes: *runtime-volumes
    restart: "no"

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment: *runtime-env
    volumes: *runtime-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      tts:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment: *runtime-env
    volumes: *runtime-volumes
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      tts:
        condition: service_healthy

  # Tunnel công khai cartoon.studev.net. Chỉ chạy khi COMPOSE_PROFILES=publish trong .env;
  # để trống (dev) thì `docker compose up` không khởi động tunnel.
  # Hostname công khai cấu hình trên Cloudflare Zero Trust: cartoon.studev.net -> http://app:3000
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["publish"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy

volumes:
  huggingface_cache:
    name: cartoon_huggingface_cache
